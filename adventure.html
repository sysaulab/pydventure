function buildFullConfig({ name, width, height, seed }) {
  const dw = width, dh = Math.max(4, Math.floor(height / 2));
  const maps = [{
    name: "overworld", kind: "overworld",
    width, height, depth: DEPTH,
    braid: 0.25, enemy_chance: 0.5,
    resource_chance: 0.15,
    description_set: "overworld",
    start: [0, 0, 1],
    features: {
      loose_items: [{ name: "bomb", count: 3, floor: 1 }],
      stair_pairs: 2,
    },
  }];
  for (let i = 1; i <= DUNGEONS; i++) {
    maps.push({
      name: `level${i}`, kind: "dungeon",
      width: dw, height: dh, depth: 1,
      braid: 0.10,
      enemy_density: i,
      resource_chance: 0.25,
      ore_count: 1,
      bomb_walls: 2,
      description_set: "dungeon",
      crystal: true, boss: "dragon",
    });
  }
  maps.push({
    name: "level8", kind: "shrine",
    width: dw, height: dh, depth: 1,
    braid: 0.08,
    enemy_density: 8,
    resource_chance: 0.25,
    ore_count: 0,
    bomb_walls: 2,
    description_set: "shrine",
    boss: "dragon_red",
    shrine: { requires: "crystal-7", victory_item: "victory" },
  });
  return {
    name, seed, width, height, depth: DEPTH,
    startMap: "overworld",
    goal: {
      name: "Collect the seven crystals",
      item: "crystal", count: DUNGEONS,
      victory_item: "victory",
      victory_message:
        "You place the seven crystals on the altar. The shrine fills with light, and the world is quiet again.",
    },
    combat: {
      damage_per_fail: 1,
      heart_item: "heart",
      shelter_item: "shelter",
      meal_item: "meal",
      fire_item: "fire",
      death: { restore_hp: true },
    },
    maps,
  };
}

function startGame(worldCfg) {
  const config = buildFullConfig(worldCfg);
  const t0 = performance.now();
  const world = new World(config);
  world.generate();
  const t1 = performance.now();
  console.log(`World generated in ${(t1 - t0).toFixed(0)} ms`);

  mapGeomCache.clear();

  let player = null, deltas = {};
  try {
    const raw = localStorage.getItem("pydventure.save");
    if (raw) {
      const saved = JSON.parse(raw);
      const same = saved.version === 2
                && saved.world && saved.world.seed === config.seed
                && saved.world.width === config.width
                && saved.world.height === config.height
                && saved.world.name === config.name;
      if (same) {
        player = Player.fromJSON(saved.player);
        deltas = saved.deltas || {};
      }
    }
  } catch (e) { console.warn("Save load failed:", e); }

  if (!player) player = new Player({ map: "overworld", x: 0, y: 0, z: 1 });

  currentSession = new Session(world, player, { deltas });

  clearFeedback();
  appendFeedback(`Welcome to ${config.name}.`, "title");
  if (player.won) appendFeedback("The world is quiet. You have already won.");
  else appendFeedback(`Carry at most ${MAX_ITEM_COUNT} of each item. Craft early.`);

  render(stateFromSession(currentSession));
  currentSession.save();
}

// --------------------------------------------------------------- form

const field = {
  name:   $("w-name"),
  width:  $("w-width"),
  height: $("w-height"),
  seed:   $("w-seed"),
};
const statusEl = $("w-status");

function clampInt(v, lo, hi, fallback) {
  const n = parseInt(v, 10);
  if (Number.isNaN(n)) return fallback;
  return Math.max(lo, Math.min(hi, n));
}
function readForm() {
  return {
    name:   field.name.value.trim() || DEFAULTS.name,
    width:  clampInt(field.width.value,  4, 32, DEFAULTS.width),
    height: clampInt(field.height.value, 4, 32, DEFAULTS.height),
    seed:   field.seed.value.trim() || DEFAULTS.seed,
  };
}
function writeForm(w) {
  field.name.value   = w.name;
  field.width.value  = w.width;
  field.height.value = w.height;
  field.seed.value   = w.seed;
}
function loadWorldCfg() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch { return null; }
}
function saveWorldCfg(w) { localStorage.setItem(STORAGE_KEY, JSON.stringify(w)); }

const existing = loadWorldCfg();
if (existing) {
  statusEl.textContent = `Welcome back to ${existing.name} — ${existing.width}×${existing.height}, seed "${existing.seed}", depth ${DEPTH}.`;
  writeForm(existing);
} else {
  statusEl.textContent = `No world found. Defaults shown: ${DEFAULTS.width}×${DEFAULTS.height}, seed "${DEFAULTS.seed}", depth ${DEPTH}.`;
  writeForm(DEFAULTS);
  saveWorldCfg(DEFAULTS);
}

$("w-regenerate").addEventListener("click", () => {
  const w = readForm();
  saveWorldCfg(w);
  statusEl.textContent = `World "${w.name}" ready — ${w.width}×${w.height}, seed "${w.seed}", depth ${DEPTH}. Click Play.`;
});

$("w-play").addEventListener("click", () => {
  const w = readForm();
  saveWorldCfg(w);
  try {
    startGame(w);
  } catch (e) {
    console.error(e);
    statusEl.textContent = `Generation failed: ${e.message}`;
    statusEl.style.color = "var(--bad)";
    return;
  }
  els.welcome.hidden = true;
});

// --------------------------------------------------------------- input

function submit(text) {
  if (!currentSession) return;
  const cmd = text.trim();
  if (!cmd) return;
  let result;
  try {
    result = currentSession.handleCommand(cmd);
  } catch (e) {
    console.error(e);
    appendFeedback(`[internal error: ${e.message}]`, "bad");
    return;
  }
  for (const line of result.lines) appendFeedback(line, classify(line));
  if (result.endedReason === "victory") showEnded("victory");
  render(stateFromSession(currentSession));
  currentSession.save();
  return result;
}

function showEnded(reason) {
  const titles = { victory: "Victory" };
  const bodies = { victory: "The seven crystals are placed. The world is quiet." };
  els.endedTitle.textContent = titles[reason] ?? "Ended";
  els.endedBody.textContent  = bodies[reason]  ?? "";
  els.ended.hidden = false;
}

els.endedClose.addEventListener("click", () => { els.ended.hidden = true; });

// --------------------------------------------------------------- click router

document.addEventListener("click", e => {
  const cmd = e.target.closest("[data-cmd]");
  if (cmd) { e.preventDefault(); submit(cmd.dataset.cmd); return; }
  const open = e.target.closest("[data-open]");
  if (open) {
    e.preventDefault();
    const id = open.dataset.open;
    if (id === "ov-map" && currentSession) renderMap(currentSession);
    if (id === "ov-combine") renderCombineInv();
    $(id).hidden = false;
    return;
  }
  const close = e.target.closest("[data-close]");
  if (close) {
    const ov = close.closest(".overlay");
    if (ov) ov.hidden = true;
  }
});

// --------------------------------------------------------------- escape

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!els.ended.hidden) { els.ended.hidden = true; return; }
  for (const ov of document.querySelectorAll(".overlay:not([hidden])")) {
    if (ov === els.welcome) continue;
    ov.hidden = true;
  }
});

// --------------------------------------------------------------- status item use

els.status.addEventListener("dblclick", e => {
  const slot = e.target.closest("[data-use]");
  if (!slot) return;
  e.preventDefault();
  submit(`use ${slot.dataset.use}`);
});

let statusPressTimer = null;
els.status.addEventListener("pointerdown", e => {
  const slot = e.target.closest("[data-use]");
  if (!slot) return;
  statusPressTimer = setTimeout(() => {
    statusPressTimer = null;
    submit(`use ${slot.dataset.use}`);
  }, 500);
});
els.status.addEventListener("pointerup", () => {
  if (statusPressTimer) { clearTimeout(statusPressTimer); statusPressTimer = null; }
});
els.status.addEventListener("pointercancel", () => {
  if (statusPressTimer) { clearTimeout(statusPressTimer); statusPressTimer = null; }
});
els.status.addEventListener("pointerleave", () => {
  if (statusPressTimer) { clearTimeout(statusPressTimer); statusPressTimer = null; }
});

// --------------------------------------------------------------- keyboard shortcuts

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const map = { n: "move n", s: "move s", e: "move e", w: "move w", u: "move u", d: "move d" };
  const cmd = map[e.key.toLowerCase()];
  if (cmd && currentSession) { e.preventDefault(); submit(cmd); }
});

// --------------------------------------------------------------- combine

els.combineInv.addEventListener("click", e => {
  const item = e.target.closest(".inv-item");
  if (!item) return;
  const name = item.dataset.item;
  if (!combineSlots.a) setSlot("a", name);
  else if (!combineSlots.b) setSlot("b", name);
  else setSlot("a", name);
});

els.combineInv.addEventListener("dragstart", e => {
  const item = e.target.closest(".inv-item");
  if (!item) return;
  e.dataTransfer.setData("text/plain", item.dataset.item);
  e.dataTransfer.effectAllowed = "copy";
});

for (const slotEl of [els.slotA, els.slotB]) {
  slotEl.addEventListener("dragover", e => { e.preventDefault(); slotEl.classList.add("over"); });
  slotEl.addEventListener("dragleave", () => slotEl.classList.remove("over"));
  slotEl.addEventListener("drop", e => {
    e.preventDefault();
    slotEl.classList.remove("over");
    const item = e.dataTransfer.getData("text/plain");
    if (item) setSlot(slotEl.dataset.slot, item);
  });
  slotEl.addEventListener("click", () => setSlot(slotEl.dataset.slot, null));
}

els.combineGo.addEventListener("click", () => {
  if (!combineSlots.a || !combineSlots.b) return;
  const cmd = `combine ${combineSlots.a} ${combineSlots.b}`;
  clearSlots();
  const result = submit(cmd);
  renderCombineInv();
  const line = result && result.lines.length
    ? result.lines[result.lines.length - 1] : "";
  els.combineFeedback.textContent = line;
  els.combineFeedback.className = "combine-feedback " + (classify(line) || "");
});

// --------------------------------------------------------------- dev

$("dev-wipe").addEventListener("click", () => {
  localStorage.removeItem("pydventure.save");
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
});
$("dev-ended").addEventListener("click", () => { els.ended.hidden = true; });

console.log("pydventure loaded.");
</script>
</body>
</html>
