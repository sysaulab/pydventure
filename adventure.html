<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pydventure</title>
<style>
:root {
  --bg:       #0e1218;
  --panel:    #0a1018;
  --panel-2:  #141a22;
  --edge:     #2a3440;
  --fg:       #e8ecf0;
  --dim:      #8892a0;
  --accent:   #7fb8e8;
  --good:     #9de8a8;
  --bad:      #e89090;
  --title:    #e8c67f;
  --open:     #5fd07a;
  --locked:   #d8a040;
  --item:     #c090e8;
  --gold:     #d8a040;
  --gold-2:   #8a6020;
  --silver:   #8a94a4;
  --silver-2: #4e5868;
  --fs:       clamp(0.85rem, 0.78rem + 0.4vw, 1.05rem);
  --gap:      clamp(0.4rem, 1vmin, 0.8rem);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: var(--fs)/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--fg); background: var(--bg);
  overflow: hidden;
}

/* -------------------------------------------------------------- app shell */

.app {
  height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(50dvh, 1fr) auto;
  grid-template-areas:
    "scene"
    "status";
}
@media (orientation: landscape) {
  .app {
    grid-template-columns: minmax(75vw, 1fr) minmax(25vw, 1fr);
    grid-template-rows: minmax(0, 1fr);
    grid-template-areas: "scene status";
  }
}
.app > .scene-wrap  { grid-area: scene; }
.app > .status-area { grid-area: status; }

/* ------------------------------------------------------------------ scene */

.scene-wrap {
  position: relative;
  background: var(--panel);
  min-height: 50dvh;
  overflow: hidden;
}
@media (orientation: landscape) {
  .scene-wrap {
    min-height: 0;
    border-right: 1px solid var(--edge);
  }
}
#scene {
  display: block;
  width: 100%; height: 100%;
}

.btn { cursor: pointer; }
.btn circle.body {
  fill: #14202c;
  stroke: var(--edge);
  stroke-width: 2;
  transition: fill 120ms, stroke 120ms;
}
.btn:hover circle.body { fill: #1d2c3a; stroke: var(--accent); }
.btn:active circle.body { fill: #0d1620; }
.btn text {
  fill: var(--fg);
  pointer-events: none;
  user-select: none;
}
.btn[data-kind="door"]    text.glyph { fill: var(--open); }
.btn[data-kind="locked"]  text.glyph { fill: var(--locked); }
.btn[data-kind="updown"]  text.glyph { fill: var(--accent); }
.btn[data-kind="special"] text.glyph { fill: var(--title); }
.btn[data-present="false"] { display: none; }
.btn text.sub { fill: var(--dim); }

/* ------------------------------------------------------------ center panel */

.center-panel {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(400px, 72%);
  max-height: 82%;
  display: flex;
  flex-direction: column;
  gap: 0.55em;
  padding: 0.9em 1em;
  background: rgba(8, 12, 18, 0.5);
  border: 1px solid var(--edge);
  border-radius: 0.7em;
  overflow-y: auto;
  font-size: 0.9em;
  z-index: 2;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}
.center-panel .desc-text {
  margin: 0;
  font-style: italic;
  color: var(--fg);
  text-wrap: pretty;
  font-size: 0.95em;
}
.center-panel .enemies,
.center-panel .items,
.center-panel .actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35em;
}
.center-panel .enemies:empty,
.center-panel .items:empty,
.center-panel .actions:empty { display: none; }

.center-panel .chip {
  display: inline-flex; align-items: baseline; gap: 0.4em;
  padding: 0.2em 0.55em;
  border-radius: 0.3rem;
  border: 1px solid var(--edge);
  background: var(--panel);
  font-family: ui-monospace, monospace;
  font-size: 0.85em;
}
.center-panel .chip.enemy { color: var(--bad);  border-color: #3a1a1a; background: #1a0a0a; }
.center-panel .chip.ep    { color: var(--dim);  background: transparent; }
.center-panel .chip.item  { color: var(--item); border-color: #3a2a4a; background: #1a1028; }
.center-panel .chip small { color: var(--dim); font-size: 0.85em; }

.center-panel .chip.item button {
  font: inherit; font-weight: 600;
  border: 0; background: #2a1e40; color: var(--item);
  padding: 0 0.6em; margin: -0.2em -0.55em -0.2em 0.2em;
  border-radius: 0 0.3rem 0.3rem 0;
  cursor: pointer;
}
.center-panel .chip.item button:hover { background: #3a2a58; }

.center-panel .actions button {
  font: inherit; font-weight: 600;
  padding: 0.4em 0.9em;
  border: 1px solid var(--edge); border-radius: 0.35rem;
  background: #1a2838; color: var(--fg); cursor: pointer;
}
.center-panel .actions button:hover { background: #26394e; }
.center-panel .actions button[data-cmd="fight"]    { color: var(--bad);  border-color: #3a1a1a; }
.center-panel .actions button[data-cmd="flee"]     { color: var(--dim); }
.center-panel .actions button[data-cmd="use fire"] { color: var(--good); border-color: #1a3a1a; }

.center-panel .feedback {
  display: flex;
  flex-direction: column;
  gap: 0.1em;
  border-top: 1px solid var(--edge);
  padding-top: 0.5em;
  margin-top: 0.1em;
  font-family: ui-monospace, monospace;
  font-size: 0.82em;
  line-height: 1.45;
  max-height: 5.4em;
  overflow: hidden;
}
.center-panel .feedback:empty { display: none; }
.center-panel .feedback p {
  margin: 0;
  white-space: pre-wrap;
  color: var(--dim);
  text-wrap: pretty;
}
.center-panel .feedback p:first-child { color: var(--fg); }
.center-panel .feedback p.good  { color: var(--good); }
.center-panel .feedback p.bad   { color: var(--bad); }
.center-panel .feedback p.title { color: var(--title); font-weight: 600; }

/* ---------------------------------------------------------------- status */

.status-area {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}

.status {
  display: flex; flex-wrap: wrap; gap: 0.5em;
  align-items: baseline;
  min-height: 0;
  padding: 0.5em 0.9em;
  background: #0a1620;
  border-top: 1px solid var(--edge);
  font-weight: 600;
}

/* --- mini map: duplicate of the map overlay, docked below the status --- */

.minimap {
  flex: 0 0 auto;
  height: min(22dvh, 190px);
  min-height: 0;
  padding: 0.35em 0.9em 0.5em;
  background: #0a1620;
  border-top: 1px solid var(--edge);
  overflow: hidden;
}
#minimap-svg {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--panel);
  border-radius: 0.4rem;
}

@media (orientation: landscape) {
  .status {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.7em;
    padding: 1.2em;
    border-top: 0;
    overflow-y: auto;
    font-size: 1.02em;
  }
  .status .sep { display: none; }

  /* fill the rest of the right-hand column, map hugs the bottom */
  .minimap {
    flex: 1 1 auto;
    height: auto;
  }
}

.status .hp   { color: var(--good); }
.status .hp.low { color: var(--bad); }
.status .goal { color: var(--title); }
.status .inv  {
  font-family: ui-monospace, monospace; font-weight: 400;
  color: var(--dim);
  display: inline-flex; flex-wrap: wrap; gap: 0.4em;
  align-items: baseline;
}
.status .inv-slot {
  padding: 0 0.25em;
  border-radius: 0.2rem;
  transition: background 100ms, color 100ms;
}
.status .inv-slot[data-use] {
  cursor: pointer;
  color: var(--item);
  user-select: none;
  -webkit-touch-callout: none;
}
.status .inv-slot[data-use]:hover {
  background: #1a2838;
  color: var(--fg);
}

/* ---------------------------------------------------------------- overlays */

.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: var(--bg);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.overlay[hidden] { display: none; }
.overlay header {
  padding: 0.7em 1em;
  background: var(--panel-2);
  border-bottom: 1px solid var(--edge);
  display: flex; align-items: center; gap: 0.6em;
  font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--dim); font-size: 0.85em;
}
.overlay header .spacer { flex: 1; }
.overlay header button {
  font: inherit; font-weight: 600; text-transform: none; letter-spacing: 0;
  padding: 0.35em 0.8em;
  border: 1px solid var(--edge); border-radius: 0.3rem;
  background: #1a2838; color: var(--fg); cursor: pointer;
}
.overlay header button:hover { background: #26394e; }

.map-body { padding: var(--gap); min-height: 0; overflow: auto; }
#map-svg {
  display: block;
  width: 100%; height: auto;
  max-height: 100%;
  background: var(--panel);
  border-radius: 0.4rem;
}

.combine-body {
  padding: var(--gap);
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr);
  gap: var(--gap);
  min-height: 0;
}
.combine-feedback {
  min-height: 1.4em;
  text-align: center;
  font-family: ui-monospace, monospace;
  font-size: 0.85em;
  color: var(--dim);
}
.combine-feedback.good { color: var(--good); }
.combine-feedback.bad  { color: var(--bad); }
.targets {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 0.6em;
  align-items: stretch;
}
.targets .plus {
  display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-size: 1.6em; font-weight: 700;
}
.slot {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 6em;
  padding: 0.8em;
  border: 2px dashed var(--edge);
  border-radius: 0.5rem;
  background: var(--panel);
  color: var(--dim);
  font-family: ui-monospace, monospace;
  text-align: center;
  transition: border-color 120ms, background 120ms;
  cursor: pointer;
}
.slot[data-filled] {
  border-style: solid;
  border-color: var(--item);
  color: var(--item);
  background: #1a1028;
}
.slot.over { border-color: var(--accent); background: #14202c; }
.slot .slot-hint { font-size: 0.85em; color: var(--dim); }
.slot .slot-item { font-size: 1.1em; font-weight: 700; }

.combine-actions { display: flex; justify-content: center; }
.combine-actions button {
  font: inherit; font-weight: 600;
  padding: 0.6em 1.6em;
  background: #1a2838; color: var(--fg);
  border: 1px solid var(--edge); border-radius: 0.35rem;
  cursor: pointer;
}
.combine-actions button:disabled { opacity: 0.35; cursor: default; }
.combine-actions button:not(:disabled):hover { background: #26394e; }

.inv-list {
  margin: 0; padding: 0; list-style: none;
  display: flex; flex-wrap: wrap; gap: 0.4em;
  align-content: flex-start;
  min-height: 0; overflow-y: auto;
}
.inv-list .inv-item {
  display: inline-flex; align-items: baseline; gap: 0.5em;
  padding: 0.4em 0.8em;
  border: 1px solid #3a2a4a;
  border-radius: 0.35rem;
  background: #1a1028;
  color: var(--item);
  font-family: ui-monospace, monospace;
  cursor: pointer;
  user-select: none;
}
.inv-list .inv-item:hover { background: #2a1a44; }
.inv-list .inv-item .count { color: var(--dim); font-size: 0.85em; }
.inv-list .empty { color: var(--dim); font-style: italic; }

.overlay.welcome {
  display: grid;
  place-items: center;
  grid-template-rows: none;
  padding: var(--gap);
  overflow-y: auto;
}
.overlay.welcome[hidden] { display: none; }
.welcome .card {
  width: min(32rem, 100%);
  max-height: calc(100dvh - 2 * var(--gap));
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 0.6rem;
  padding: 1.6em;
  display: flex; flex-direction: column; gap: 1.1em;
}
.welcome h1 { margin: 0; font-size: 1.6em; letter-spacing: 0.02em; color: var(--gold); }
.welcome .sub { margin: 0; color: var(--dim); font-size: 0.9em; min-height: 1.4em; }
.welcome .form { display: flex; flex-direction: column; gap: 0.8em; }
.welcome label { display: flex; flex-direction: column; gap: 0.25em; }
.welcome label span {
  font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--dim); font-weight: 600;
}
.welcome input {
  font: inherit; font-family: ui-monospace, monospace;
  padding: 0.5em 0.7em;
  background: var(--panel-2); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 0.35rem;
  font-size: 1rem;
}
.welcome input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.welcome .field-row { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 0.6em; }
.welcome .actions { display: flex; gap: 0.6em; justify-content: flex-end; margin-top: 0.3em; }
.welcome .actions button {
  font: inherit; font-weight: 600;
  padding: 0.7em 1.2em;
  border-radius: 0.35rem;
  cursor: pointer;
  letter-spacing: 0.03em;
}
.welcome #w-regenerate { background: #1a2838; color: var(--fg); border: 1px solid var(--edge); }
.welcome #w-regenerate:hover { background: #26394e; }
.welcome #w-play { background: var(--gold); color: #1a1208; border: 0; }
.welcome #w-play:hover { background: #e8c67f; }

.ended {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center;
  background: rgba(0,0,0,0.7);
}
.ended[hidden] { display: none; }
.ended .box {
  max-width: 32rem; padding: 1.5em;
  background: var(--panel);
  border: 1px solid var(--edge); border-radius: 0.5rem;
  text-align: center;
}
.ended h2 { margin: 0 0 0.5em; color: var(--title); }
.ended p  { margin: 0 0 1em; color: var(--dim); }
.ended button {
  font: inherit; font-weight: 600;
  padding: 0.6em 1.6em;
  background: #1a2838; color: var(--fg);
  border: 1px solid var(--edge); border-radius: 0.35rem;
  cursor: pointer;
}
.ended button:hover { background: #26394e; }

.dev {
  position: fixed; bottom: 0.4em; right: 0.4em; z-index: 30;
  font-size: 0.75rem; color: var(--dim);
  background: var(--panel-2); border: 1px solid var(--edge);
  border-radius: 0.3rem; padding: 0.2em 0.4em;
}
.dev button {
  font: inherit; background: transparent; color: var(--accent);
  border: 0; cursor: pointer; margin-left: 0.3em;
}
</style>
</head>
<body>

<div class="app">

  <main class="scene-wrap">
    <svg id="scene" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" aria-label="Room scene">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"    stop-color="#4a6a8a"/>
          <stop offset="0.55" stop-color="#8a9a94"/>
          <stop offset="1"    stop-color="#3a4a3a"/>
        </linearGradient>
        <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
          <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
          <stop offset="1"    stop-color="#000" stop-opacity="0.55"/>
        </radialGradient>
      </defs>

      <g id="terrain">
        <rect id="terrain-bg" width="900" height="700" fill="url(#sky)"/>
        <path d="M0,500 L120,380 L240,470 L380,340 L520,440 L680,320 L820,420 L900,380 L900,700 L0,700 Z"
              fill="#2a3a4a" opacity="0.7"/>
        <path d="M0,580 L180,500 L340,560 L480,470 L640,560 L780,490 L900,560 L900,700 L0,700 Z"
              fill="#1d2b38" opacity="0.8"/>
        <path d="M0,650 L900,650 L900,700 L0,700 Z" fill="#0e1a22"/>
        <rect width="900" height="700" fill="url(#vignette)"/>
      </g>

      <g id="rose" transform="translate(450,350)">
        <g fill-rule="evenodd">
          <g transform="rotate(45)">
            <polygon points="0,-95 10,-12 0,0"  fill="var(--silver)"/>
            <polygon points="0,-95 -10,-12 0,0" fill="var(--silver-2)"/>
          </g>
          <g transform="rotate(135)">
            <polygon points="0,-95 10,-12 0,0"  fill="var(--silver)"/>
            <polygon points="0,-95 -10,-12 0,0" fill="var(--silver-2)"/>
          </g>
          <g transform="rotate(225)">
            <polygon points="0,-95 10,-12 0,0"  fill="var(--silver)"/>
            <polygon points="0,-95 -10,-12 0,0" fill="var(--silver-2)"/>
          </g>
          <g transform="rotate(315)">
            <polygon points="0,-95 10,-12 0,0"  fill="var(--silver)"/>
            <polygon points="0,-95 -10,-12 0,0" fill="var(--silver-2)"/>
          </g>
        </g>
        <g fill-rule="evenodd">
          <g transform="rotate(0)">
            <polygon points="0,-135 15,-16 0,0"  fill="var(--gold)"/>
            <polygon points="0,-135 -15,-16 0,0" fill="var(--gold-2)"/>
          </g>
          <g transform="rotate(90)">
            <polygon points="0,-135 15,-16 0,0"  fill="var(--gold)"/>
            <polygon points="0,-135 -15,-16 0,0" fill="var(--gold-2)"/>
          </g>
          <g transform="rotate(180)">
            <polygon points="0,-135 15,-16 0,0"  fill="var(--gold)"/>
            <polygon points="0,-135 -15,-16 0,0" fill="var(--gold-2)"/>
          </g>
          <g transform="rotate(270)">
            <polygon points="0,-135 15,-16 0,0"  fill="var(--gold)"/>
            <polygon points="0,-135 -15,-16 0,0" fill="var(--gold-2)"/>
          </g>
        </g>
        <circle r="30" fill="var(--panel)" stroke="var(--gold)" stroke-width="2"/>
        <circle r="12" fill="var(--gold)"/>
        <circle r="4"  fill="var(--panel)"/>
      </g>

      <g id="buttons">
        <g class="btn" data-kind="door" data-dir="N" data-cmd="move n"
           transform="translate(450,56)" role="button" tabindex="0" aria-label="Move north">
          <circle class="body" r="46"/>
          <text class="glyph" y="10" text-anchor="middle" font-size="30" font-weight="700">N</text>
          <text class="sub" y="30" text-anchor="middle" font-size="14"></text>
        </g>
        <g class="btn" data-kind="door" data-dir="S" data-cmd="move s"
           transform="translate(450,644)" role="button" tabindex="0" aria-label="Move south">
          <circle class="body" r="46"/>
          <text class="glyph" y="10" text-anchor="middle" font-size="30" font-weight="700">S</text>
          <text class="sub" y="30" text-anchor="middle" font-size="14"></text>
        </g>
        <g class="btn" data-kind="door" data-dir="E" data-cmd="move e"
           transform="translate(844,350)" role="button" tabindex="0" aria-label="Move east">
          <circle class="body" r="46"/>
          <text class="glyph" y="10" text-anchor="middle" font-size="30" font-weight="700">E</text>
          <text class="sub" y="30" text-anchor="middle" font-size="14"></text>
        </g>
        <g class="btn" data-kind="door" data-dir="W" data-cmd="move w"
           transform="translate(56,350)" role="button" tabindex="0" aria-label="Move west">
          <circle class="body" r="46"/>
          <text class="glyph" y="10" text-anchor="middle" font-size="30" font-weight="700">W</text>
          <text class="sub" y="30" text-anchor="middle" font-size="14"></text>
        </g>
        <g class="btn" data-kind="updown" data-dir="U" data-cmd="move u"
           transform="translate(84,84)" role="button" tabindex="0" aria-label="Go up">
          <circle class="body" r="40"/>
          <text class="glyph" y="12" text-anchor="middle" font-size="34" font-weight="700">↑</text>
          <text class="sub" y="28" text-anchor="middle" font-size="14"></text>
        </g>
        <g class="btn" data-kind="updown" data-dir="D" data-cmd="move d"
           transform="translate(816,616)" role="button" tabindex="0" aria-label="Go down">
          <circle class="body" r="40"/>
          <text class="glyph" y="12" text-anchor="middle" font-size="34" font-weight="700">↓</text>
          <text class="sub" y="28" text-anchor="middle" font-size="14"></text>
        </g>
        <g class="btn" data-kind="special" data-open="ov-combine"
           transform="translate(84,616)" role="button" tabindex="0" aria-label="Combine">
          <circle class="body" r="40"/>
          <text class="glyph" y="18" text-anchor="middle" font-size="52" font-weight="700">⚗</text>
        </g>
        <g class="btn" data-kind="special" data-open="ov-map"
           transform="translate(816,84)" role="button" tabindex="0" aria-label="Map">
          <circle class="body" r="40"/>
          <text class="glyph" y="17" text-anchor="middle" font-size="48" font-weight="700">⊞</text>
        </g>
      </g>
    </svg>

    <div class="center-panel" id="center-panel">
      <p   class="desc-text" id="desc-text"></p>
      <div class="enemies"   id="center-enemies"></div>
      <div class="items"     id="center-items"></div>
      <div class="actions"   id="center-actions"></div>
      <div class="feedback"  id="feedback"></div>
    </div>
  </main>

  <footer class="status-area">
    <div class="status" id="status"></div>
    <div class="minimap">
      <svg id="minimap-svg" viewBox="0 0 400 400"
           preserveAspectRatio="xMidYMax meet" aria-label="Mini map"></svg>
    </div>
  </footer>

</div>

<!-- ============================================================= welcome -->
<div class="overlay welcome" id="ov-welcome">

const DIRS = ["N", "E", "S", "W"];
const DELTA = { N: [0, 1], S: [0, -1], E: [1, 0], W: [-1, 0], U: [0, 0, 1], D: [0, 0, -1] };
const OPPOSITE = { N: "S", S: "N", E: "W", W: "E", U: "D", D: "U" };
const DIR_NAMES = { N: "north", E: "east", S: "south", W: "west", U: "up", D: "down" };

const FIRE_MAX_DAMAGE = 20;

// ============================================================================
// RNG
// ============================================================================

function hashString(s) {
  let h = 2166136261 >>> 0;
  const str = String(s);
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function seedFromAny(s) {
  if (typeof s === "number" && Number.isFinite(s)) return s >>> 0;
  const trimmed = String(s).trim();
  const n = Number(trimmed);
  if (!Number.isNaN(n) && String(n) === trimmed) return n >>> 0;
  return hashString(trimmed);
}

class RNG {
  constructor(seed) { this.a = seedFromAny(seed) >>> 0; }
  next() {
    this.a = (this.a + 0x6D2B79F5) | 0;
    let t = Math.imul(this.a ^ (this.a >>> 15), 1 | this.a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(lo, hi) { return Math.floor(this.next() * (hi - lo + 1)) + lo; }
  range(n)    { return this.int(0, n - 1); }
  choice(a)   { return a[this.range(a.length)]; }
  shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = this.range(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  weighted(pairs) {
    let total = 0;
    for (const [, w] of pairs) total += w;
    let r = this.next() * total;
    let acc = 0;
    for (const [k, w] of pairs) { acc += w; if (r < acc) return k; }
    return pairs[pairs.length - 1][0];
  }
}

// ============================================================================
// WORLD GENERATION
// ============================================================================

class Maze {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.walls = {};
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++)
        this.walls[`${x},${y}`] = { N: true, E: true, S: true, W: true };
  }
  inBounds(x, y) { return x >= 0 && x < this.w && y >= 0 && y < this.h; }
  *neighbors(x, y) {
    for (const d of DIRS) {
      const [dx, dy] = DELTA[d];
      const nx = x + dx, ny = y + dy;
      if (this.inBounds(nx, ny)) yield [d, nx, ny];
    }
  }
  openWall(x, y, d) {
    const [dx, dy] = DELTA[d];
    const nx = x + dx, ny = y + dy;
    if (!this.inBounds(nx, ny)) return;
    this.walls[`${x},${y}`][d] = false;
    this.walls[`${nx},${ny}`][OPPOSITE[d]] = false;
  }
  exits(x, y) {
    const w = this.walls[`${x},${y}`];
    return DIRS.filter(d => !w[d]);
  }
  isDeadEnd(x, y) { return this.exits(x, y).length === 1; }
  carve(rng) {
    const sx = rng.range(this.w), sy = rng.range(this.h);
    const visited = new Set([`${sx},${sy}`]);
    const stack = [[sx, sy]];
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const unvisited = [];
      for (const [d, nx, ny] of this.neighbors(x, y))
        if (!visited.has(`${nx},${ny}`)) unvisited.push([d, nx, ny]);
      if (!unvisited.length) { stack.pop(); continue; }
      const [d, nx, ny] = rng.choice(unvisited);
      this.openWall(x, y, d);
      visited.add(`${nx},${ny}`);
      stack.push([nx, ny]);
    }
  }
  braid(rng, amount) {
    const dead = [];
    for (let y = 0; y < this.h; y++)
      for (let x = 0; x < this.w; x++)
        if (this.isDeadEnd(x, y)) dead.push([x, y]);
    rng.shuffle(dead);
    const n = Math.floor(dead.length * amount);
    for (const [x, y] of dead.slice(0, n)) {
      const cands = [];
      for (const [d, nx, ny] of this.neighbors(x, y))
        if (this.walls[`${x},${y}`][d]) cands.push([d, nx, ny]);
      if (!cands.length) continue;
      const [d] = rng.choice(cands);
      this.openWall(x, y, d);
    }
  }
}

function bfsDistances(maze, start) {
  const key = (x, y) => `${x},${y}`;
  const dist = new Map([[key(start[0], start[1]), 0]]);
  const q = [start];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [d, nx, ny] of maze.neighbors(x, y)) {
      if (maze.walls[key(x, y)][d]) continue;
      if (dist.has(key(nx, ny))) continue;
      dist.set(key(nx, ny), dist.get(key(x, y)) + 1);
      q.push([nx, ny]);
    }
  }
  return dist;
}

function formatExits(exits) {
  const words = exits.filter(e => DIR_NAMES[e]).map(e => DIR_NAMES[e]);
  if (!words.length) return "nowhere";
  if (words.length === 1) return words[0];
  if (words.length === 2) return `${words[0]} and ${words[1]}`;
  return words.slice(0, -1).join(", ") + ", and " + words[words.length - 1];
}

class Level {
  constructor(cfg, worldCfg, rng) {
    this.cfg = cfg;
    this.world = worldCfg;
    this.rng = rng;
    this.name = cfg.name;
    this.kind = cfg.kind;
    this.width = cfg.width;
    this.height = cfg.height;
    this.depth = cfg.depth;
    this.descrRng = new RNG(`${worldCfg.seed}:${cfg.name}:descr`);
    this.floors = {};
    this.terrains = {};
    this.enemies = {};
    this.items = {};
    this.features = {};
    this.doorReqs = {};
    this.teleports = {};
    this.descriptions = {};
  }
  key(x, y, z) { return `${x},${y},${z}`; }

  generate() {
    this.carve();
    this.assignTerrain();
    if (this.kind === "overworld") {
      this.placeStairs();
      this.placeLooseItems();
      this.clearStart();
    } else if (this.kind === "dungeon") {
      this.placeCrystal();
    } else if (this.kind === "shrine") {
      this.placeShrine();
    }
    this.placeResources();
    this.placeOre();
    this.placeEnemies();
    this.placeBombWalls();
  }

  carve() {
    for (let z = 0; z < this.depth; z++) {
      const m = new Maze(this.width, this.height);
      m.carve(this.rng);
      m.braid(this.rng, this.cfg.braid ?? 0.25);
      this.floors[z] = m;
    }
  }

  assignTerrain() {
    for (let z = 0; z < this.depth; z++) {
      const pool = [];
      for (const [tname, tdata] of Object.entries(TERRAINS).sort()) {
        if (tdata.kind !== this.kind) continue;
        if (!(tdata.floors || []).includes(z)) continue;
        pool.push([tname, tdata.weight]);
      }
      if (!pool.length) continue;
      for (let y = 0; y < this.height; y++)
        for (let x = 0; x < this.width; x++)
          this.terrains[this.key(x, y, z)] = this.rng.weighted(pool);
    }
  }

  emptyCells(z) {
    const cells = [];
    for (let y = 0; y < this.height; y++)
      for (let x = 0; x < this.width; x++) {
        const k = this.key(x, y, z);
        if (!this.features[k] && !this.items[k] && !this.enemies[k]) cells.push([x, y]);
      }
    this.rng.shuffle(cells);
    return cells;
  }

  placeStairs() {
    const count = this.cfg.features?.stair_pairs ?? 0;
    if (this.depth < 2 || count === 0) return;
    const cands = [];
    for (let y = 0; y < this.height; y++)
      for (let x = 0; x < this.width; x++) cands.push([x, y]);
    this.rng.shuffle(cands);
    const pairs = [];
    for (let z = 0; z < this.depth - 1; z++) pairs.push([z, z + 1]);
    let placed = 0;
    for (const [x, y] of cands) {
      if (placed >= count) break;
      const [zLo, zHi] = this.rng.choice(pairs);
      if (this.features[this.key(x, y, zLo)] || this.features[this.key(x, y, zHi)]) continue;
      (this.features[this.key(x, y, zLo)] ||= []).push("stairs_up");
      (this.features[this.key(x, y, zHi)] ||= []).push("stairs_down");
      placed++;
    }
  }

  placeLooseItems() {
    for (const spec of this.cfg.features?.loose_items ?? []) {
      const z = spec.floor ?? 0;
      if (z >= this.depth) continue;
      const count = spec.count ?? 1;
      const cells = this.emptyCells(z);
      if (!cells.length) continue;
      const [x, y] = cells[0];
      let payload = spec.name;
      if (count > 1) payload += `+${count - 1}`;
      (this.features[this.key(x, y, z)] ||= []).push("item");
      (this.items[this.key(x, y, z)] ||= []).push(payload);
    }
  }

  placeResources() {
    const chance = this.cfg.resource_chance ?? 0;
    if (chance <= 0) return;
    for (let z = 0; z < this.depth; z++)
      for (let y = 0; y < this.height; y++)
        for (let x = 0; x < this.width; x++) {
          const k = this.key(x, y, z);
          if (this.items[k] || this.features[k]) continue;
          if (this.rng.next() >= chance) continue;
          const pool = TERRAIN_RESOURCES[this.terrains[k]];
          if (!pool) continue;
          this.items[k] = [this.rng.weighted(pool)];
        }
  }

  placeOre() {
    const count = this.cfg.ore_count ?? 0;
    if (count <= 0) return;
    for (let z = 0; z < this.depth; z++) {
      let placed = 0, attempts = 0;
      while (placed < count && attempts < 500) {
        attempts++;
        const x = this.rng.range(this.width);
        const y = this.rng.range(this.height);
        const k = this.key(x, y, z);
        if (this.items[k] || this.features[k]) continue;
        this.items[k] = ["ore"];
        placed++;
      }
    }
  }

  placeEnemies() {
    const density = this.cfg.enemy_density;
    const chance = this.cfg.enemy_chance;
    for (let z = 0; z < this.depth; z++)
      for (let y = 0; y < this.height; y++)
        for (let x = 0; x < this.width; x++) {
          const k = this.key(x, y, z);
          if (this.enemies[k]) continue;
          const tname = this.terrains[k];
          if (!tname) continue;
          const pool = TERRAINS[tname]?.enemies || [];
          if (!pool.length) continue;
          if (density != null) {
            const n = this.rng.int(0, density) + this.rng.int(0, density);
            if (n <= 0) continue;
            const list = [];
            for (let i = 0; i < n; i++) list.push(this.rng.choice(pool));
            this.enemies[k] = list;
          } else if (chance != null) {
            if (this.rng.next() >= chance) continue;
            this.enemies[k] = [this.rng.choice(pool)];
          }
        }
  }

  placeBombWalls() {
    const count = this.cfg.bomb_walls ?? 0;
    if (count <= 0) return;
    for (let z = 0; z < this.depth; z++) {
      const m = this.floors[z];
      let placed = 0, attempts = 0;
      while (placed < count && attempts < 200) {
        attempts++;
        const x = this.rng.range(this.width);
        const y = this.rng.range(this.height);
        const walled = [];
        for (const d of "NESW") {
          const [dx, dy] = DELTA[d];
          if (m.walls[`${x},${y}`][d] && m.inBounds(x + dx, y + dy)) walled.push(d);
        }
        if (!walled.length) continue;
        const d = this.rng.choice(walled);
        const [dx, dy] = DELTA[d];
        const nx = x + dx, ny = y + dy;
        const back = OPPOSITE[d];
        if (this.doorReqs[`${x},${y},${z},${d}`]) continue;
        if (this.doorReqs[`${nx},${ny},${z},${back}`]) continue;
        m.openWall(x, y, d);
        this.doorReqs[`${x},${y},${z},${d}`] = "bomb-1";
        this.doorReqs[`${nx},${ny},${z},${back}`] = "bomb-1";
        placed++;
      }
    }
  }

  farDeadEnd(z = 0, avoid = [0, 0]) {
    const m = this.floors[z];
    const dist = bfsDistances(m, avoid);
    const sorted = [...dist.entries()].sort((a, b) => {
      const [ax, ay] = a[0].split(",").map(Number);
      const [bx, by] = b[0].split(",").map(Number);
      return ax !== bx ? ax - bx : ay - by;
    });
    let best = null, bestD = -1;
    for (const [k, d] of sorted) {
      const [x, y] = k.split(",").map(Number);
      if (x === avoid[0] && y === avoid[1]) continue;
      if (!m.isDeadEnd(x, y)) continue;
      if (d > bestD) { bestD = d; best = [x, y]; }
    }
    if (!best) {
      for (const [k, d] of sorted) {
        const [x, y] = k.split(",").map(Number);
        if (x === avoid[0] && y === avoid[1]) continue;
        if (d > bestD) { bestD = d; best = [x, y]; }
      }
    }
    return best;
  }

  placeCrystal() {
    if (!this.cfg.crystal) return;
    const cell = this.farDeadEnd();
    if (!cell) return;
    const [x, y] = cell;
    (this.items[this.key(x, y, 0)] ||= []).push("crystal");
    (this.features[this.key(x, y, 0)] ||= []).push("crystal_chamber");
    this.enemies[this.key(x, y, 0)] = [this.cfg.boss || "dragon"];
  }

  placeShrine() {
    const cfg = this.cfg.shrine;
    if (!cfg) return;
    const cell = this.farDeadEnd();
    if (!cell) return;
    const [sx, sy] = cell;
    const m = this.floors[0];
    const ex = m.exits(sx, sy);
    if (!ex.length) return;
    const ed = ex[0];
    const [dx, dy] = DELTA[ed];
    const nx = sx + dx, ny = sy + dy;
    if (!m.inBounds(nx, ny)) return;
    const back = OPPOSITE[ed];
    this.doorReqs[`${nx},${ny},0,${back}`] = cfg.requires;
    (this.items[this.key(sx, sy, 0)] ||= []).push(cfg.victory_item);
    (this.features[this.key(sx, sy, 0)] ||= []).push("shrine");
    if (this.cfg.boss) this.enemies[this.key(sx, sy, 0)] = [this.cfg.boss];
  }

  clearStart() {
    const [sx, sy, sz] = this.cfg.start || [0, 0, 0];
    delete this.enemies[this.key(sx, sy, sz)];
  }

  setTeleport(x, y, z, dir, target) {
    this.teleports[`${x},${y},${z},${dir}`] = target;
  }

  composeDescriptions() {
    const patterns = DESCRIPTION_SETS[this.cfg.description_set]?.patterns
      || ["You are in {terrain}."];
    for (let z = 0; z < this.depth; z++)
      for (let y = 0; y < this.height; y++)
        for (let x = 0; x < this.width; x++)
          this.descriptions[this.key(x, y, z)] = this.describe(x, y, z, patterns);
  }

  describe(x, y, z, patterns) {
    const k = this.key(x, y, z);
    const tname = this.terrains[k] || "?";
    const terrain = TERRAINS[tname]?.description || tname;
    const feats = this.features[k] || [];
    const m = this.floors[z];
    const exits = [...m.exits(x, y)];
    for (const d of "UD") {
      if (this.teleports[`${x},${y},${z},${d}`]) exits.push(d);
      else {
        const key = d === "U" ? "stairs_up" : "stairs_down";
        if (feats.includes(key)) exits.push(d);
      }
    }
    const exitsText = formatExits(exits);
    const featureText = feats.map(f => FEATURE_PHRASES[f] || "").join("");
    const pattern = patterns[this.descrRng.range(patterns.length)];
    return pattern
      .replace(/{terrain}/g, terrain)
      .replace(/{Terrain}/g, terrain ? terrain[0].toUpperCase() + terrain.slice(1) : "")
      .replace(/{exits}/g, exitsText)
      .replace(/{Exits}/g, exitsText ? exitsText[0].toUpperCase() + exitsText.slice(1) : "")
      .replace(/{feature}/g, featureText);
  }
}

function parseRequirement(text) {
  const m = String(text).trim().match(/^(.+?)-(\d+)$/);
  if (m) return { name: m[1].trim(), consume: parseInt(m[2], 10) };
  return { name: String(text).trim(), consume: 0 };
}

function parseItemSpec(spec) {
  let s = String(spec);
  let count = 1;
  const plusIdx = s.indexOf("+");
  if (plusIdx >= 0) {
    const c = parseInt(s.slice(plusIdx + 1), 10);
    if (!Number.isNaN(c)) count = 1 + c;
    s = s.slice(0, plusIdx);
  }
  return { name: s.trim(), count };
}

function parseTeleport(text) {
  const s = String(text).replace(/^</, "").replace(/>$/, "");
  const [mapName, coords] = s.split(":");
  const [x, y, z] = coords.split(",");
  return {
    map: mapName.trim(),
    x: parseInt(x, 10), y: parseInt(y, 10), z: parseInt(z, 10),
  };
}

function enemyMaxHp(name) {
  return ENEMIES[name]?.difficulty ?? 1;
}

function buildRoom(level, x, y, z) {
  const k = level.key(x, y, z);
  const m = level.floors[z];
  const doors = {};

  for (const d of "NESW") {
    if (m.walls[`${x},${y}`][d]) continue;
    const door = { pass: [], teleport: null };
    const req = level.doorReqs[`${x},${y},${z},${d}`];
    if (req) door.pass.push(parseRequirement(req));
    doors[d] = door;
  }
  for (const d of "UD") {
    const tp = level.teleports[`${x},${y},${z},${d}`];
    if (tp) {
      doors[d] = { pass: [], teleport: parseTeleport(tp) };
    } else {
      const feats = level.features[k] || [];
      const key = d === "U" ? "stairs_up" : "stairs_down";
      if (feats.includes(key)) doors[d] = { pass: [], teleport: null };
    }
  }

  const enemies = (level.enemies[k] || []).map(name => ({
    name, hp: enemyMaxHp(name),
  }));

  const items = [];
  for (const spec of level.items[k] || []) items.push(parseItemSpec(spec));

  return {
    map: level.name, x, y, z,
    description: level.descriptions[k] || "",
    doors,
    enemies,
    items,
  };
}

class World {
  constructor(config) {
    this.config = config;
    this.seed = config.seed;
    this.rng = new RNG(config.seed);
    this.levels = {};
    this.rooms = {};
  }
  generate() {
    for (const mcfg of this.config.maps) {
      const lvl = new Level(mcfg, this.config, this.rng);
      lvl.generate();
      this.levels[mcfg.name] = lvl;
    }
    this.linkDungeons();
    for (const lvl of Object.values(this.levels)) lvl.composeDescriptions();
    this.buildRooms();
  }
  linkDungeons() {
    const ow = this.levels.overworld;
    if (!ow) return;
    const m = ow.floors[0];
    const used = new Set();
    const cells = [];
    for (let y = 0; y < ow.height; y++)
      for (let x = 0; x < ow.width; x++) cells.push([x, y]);
    const dead = cells.filter(([x, y]) => m.isDeadEnd(x, y));
    const other = cells.filter(([x, y]) => !m.isDeadEnd(x, y));
    this.rng.shuffle(dead);
    this.rng.shuffle(other);
    const ordered = [...dead, ...other];
    for (const [name, lvl] of Object.entries(this.levels)) {
      if (name === "overworld") continue;
      const cell = ordered.find(c => !used.has(`${c[0]},${c[1]}`));
      if (!cell) continue;
      used.add(`${cell[0]},${cell[1]}`);
      const [ox, oy] = cell;
      ow.setTeleport(ox, oy, 0, "D", `<${name}:0,0,0>`);
      lvl.setTeleport(0, 0, 0, "U", `<overworld:${ox},${oy},0>`);
    }
  }
  buildRooms() {
    for (const [name, lvl] of Object.entries(this.levels)) {
      for (let z = 0; z < lvl.depth; z++)
        for (let y = 0; y < lvl.height; y++)
          for (let x = 0; x < lvl.width; x++)
            this.rooms[`${name}|${x},${y},${z}`] = buildRoom(lvl, x, y, z);
    }
  }
  getRoom(mapName, x, y, z) { return this.rooms[`${mapName}|${x},${y},${z}`] || null; }
  mapNames() { return Object.keys(this.levels); }
  dimensions(mapName) {
    const lvl = this.levels[mapName];
    if (!lvl) return { x: 0, y: 0, z: 0 };
    return { x: lvl.width, y: lvl.height, z: lvl.depth };
  }
}

// ============================================================================
// PLAYER
// ============================================================================

class Player {
  constructor(data = {}) {
    this.inventory  = data.inventory  ? { ...data.inventory }  : {};
    this.skills     = data.skills     ? { ...data.skills }     : { fight: 0, avoidance: 0 };
    this.map        = data.map        ?? "overworld";
    this.x          = data.x          ?? 0;
    this.y          = data.y          ?? 0;
    this.z          = data.z          ?? 1;
    this.swordLevel = data.swordLevel ?? 0;
    this.won        = data.won        ?? false;
    this.hp         = data.hp         ?? 5;
    this.maxHp      = data.maxHp      ?? 5;
  }
  takeDamage(n) { this.hp = Math.max(0, this.hp - n); }
  healFull() { this.hp = this.maxHp; }

  // Returns the number actually added (may be less than `count` when capped).
  addItem(name, count = 1) {
    if (count <= 0) return 0;
    const have = this.inventory[name] || 0;
    const room = MAX_ITEM_COUNT - have;
    const added = Math.max(0, Math.min(count, room));
    if (added > 0) this.inventory[name] = have + added;
    return added;
  }
  removeItem(name, count = 1) {
    if (count <= 0) return true;
    if ((this.inventory[name] || 0) >= count) {
      this.inventory[name] -= count;
      if (this.inventory[name] === 0) delete this.inventory[name];
      return true;
    }
    return false;
  }
  hasItem(name, count = 1) { return (this.inventory[name] || 0) >= count; }
  isFullOf(name) {
    if (name === "sword") return false;   // sword level is not inventory
    return (this.inventory[name] || 0) >= MAX_ITEM_COUNT;
  }
  getSkill(s) { return this.skills[s] || 0; }
  increaseSkill(s) { this.skills[s] = (this.skills[s] || 0) + 1; }

  // Returns the number actually granted.
  grant(name, count = 1) {
    if (name === "sword") { this.swordLevel += count; return count; }
    return this.addItem(name, count);
  }
  toJSON() {
    return {
      inventory: this.inventory, skills: this.skills,
      map: this.map, x: this.x, y: this.y, z: this.z,
      swordLevel: this.swordLevel, won: this.won,
      hp: this.hp, maxHp: this.maxHp,
    };
  }
  static fromJSON(d) { return new Player(d); }
}

// ============================================================================
// ROOM STATE
// ============================================================================

class RoomState {
  constructor(room, player) {
    this.room = room;
    this.player = player;
  }
  isDoorVisible(dir) { return !!this.room.doors[dir]; }
  canUseDoor(dir) {
    const di = this.room.doors[dir];
    if (!di) return false;
    if (!di.pass.length) return true;
    const req = di.pass[0];
    return this.player.hasItem(req.name, req.consume);
  }
  useDoor(dir) {
    if (!this.canUseDoor(dir)) return false;
    const di = this.room.doors[dir];
    if (di.pass.length) {
      const req = di.pass[0];
      if (req.consume > 0 && !this.player.removeItem(req.name, req.consume))
        return false;
      di.pass.shift();
    }
    return true;
  }
  currentEnemies() { return this.room.enemies; }
  enemyPower(enemies) {
    let t = 0;
    for (const e of enemies) t += Math.max(0, e.hp);
    return t;
  }
  rollDrops(enemies) {
    const totals = {};
    for (const e of enemies) {
      const items = (DROPS[e.name] || {}).items || {};
      for (const [iname, irange] of Object.entries(items)) {
        const n = Array.isArray(irange)
          ? Math.floor(Math.random() * (irange[1] - irange[0] + 1)) + irange[0]
          : irange;
        if (n) totals[iname] = (totals[iname] || 0) + n;
      }
    }
    return totals;
  }
  fightEnemies(combat) {
    const enemies = this.currentEnemies();
    if (!enemies.length) return { ok: false, msg: "No enemies here." };
    const ep = this.enemyPower(enemies);
    const pool = 1 + this.player.getSkill("fight") + 20 * this.player.swordLevel;
    const roll = Math.floor(Math.random() * (pool + 1));
    const enemyRoll = Math.floor(Math.random() * (ep + 1));
    if (roll < enemyRoll) {
      const dmg = combat.damage_per_fail;
      this.player.takeDamage(dmg);
      return { ok: false, msg: `You are driven back! (-${dmg} HP) (you ${roll} vs them ${enemyRoll}; FP ${pool} vs EP ${ep})` };
    }
    this.player.increaseSkill("fight");
    const loot = this.rollDrops(enemies);
    this.room.enemies = [];
    let msg = `You defeat the enemies! (you ${roll} vs them ${enemyRoll}; FP ${pool} vs EP ${ep})`;
    const keys = Object.keys(loot).sort();
    const taken = [];
    const spilled = [];
    for (const iname of keys) {
      const n = loot[iname];
      const got = this.player.grant(iname, n);
      if (got > 0) taken.push(got === 1 ? iname : `${iname} x${got}`);
      if (got < n) spilled.push(n - got === 1 ? iname : `${iname} x${n - got}`);
    }
    if (taken.length) msg += " You collect " + taken.join(", ") + ".";
    if (spilled.length)
      msg += ` You leave ${spilled.join(", ")} behind — no room to carry it.`;
    return { ok: true, msg };
  }
  avoidEnemies(combat) {
    const enemies = this.currentEnemies();
    if (!enemies.length) return { ok: false, msg: "No enemies here." };
    const ep = this.enemyPower(enemies);
    const pool = 1 + this.player.getSkill("avoidance");
    const roll = Math.floor(Math.random() * (pool + 1));
    const enemyRoll = Math.floor(Math.random() * (ep + 1));
    if (roll < enemyRoll) {
      const dmg = combat.damage_per_fail;
      this.player.takeDamage(dmg);
      return { ok: false, msg: `You fail to slip past. (-${dmg} HP) (you ${roll} vs them ${enemyRoll}; AP ${pool} vs EP ${ep})` };
    }
    this.player.increaseSkill("avoidance");
    return { ok: true, msg: `You slip past the enemies! (you ${roll} vs them ${enemyRoll}; AP ${pool} vs EP ${ep})` };
  }
  throwFire() {
    const enemies = this.room.enemies;
    if (!enemies.length) return { ok: false, msg: "No enemies here." };
    const target = enemies[0];
    const dmg = Math.floor(Math.random() * (FIRE_MAX_DAMAGE - FIRE_MIN_DAMAGE + 1)) + FIRE_MIN_DAMAGE;
    target.hp -= dmg;
    if (target.hp <= 0) {
      enemies.shift();
      return { ok: true, msg: `You hurl the fire at the ${target.name}. It takes ${dmg} damage and falls.` };
    }
    return { ok: true, msg: `You hurl the fire at the ${target.name}. It takes ${dmg} damage (${target.hp} HP left).` };
  }
  currentItems() { return this.room.items; }
  takeItem(name) {
    const items = this.room.items;
    const i = items.findIndex(it => it.name === name);
    if (i < 0) return { ok: false, msg: "That item is not here." };
    const item = items[i];
    if (this.player.isFullOf(item.name)) {
      return { ok: false, msg: `You can't carry any more ${item.name} (max ${MAX_ITEM_COUNT}).` };
    }
    const got = this.player.addItem(item.name, item.count);
    if (got < item.count) {
      item.count -= got;
      return { ok: true, msg: `You take ${item.name} x${got}. You leave ${item.count} behind — no room to carry more.` };
    }
    items.splice(i, 1);
    return { ok: true, msg: `You take ${item.name} x${got}.` };
  }
}

// ============================================================================
// SESSION
// ============================================================================

class Session {
  constructor(world, player, opts = {}) {
    this.world = world;
    this.player = player;
    this.combat = opts.combat || world.config.combat;
    this.goal = opts.goal || world.config.goal;
    this.deltas = opts.deltas || {};
    this.roomState = null;
    this.loadCurrentRoom();
  }
  loadCurrentRoom() {
    const p = this.player;
    const key = `${p.map}|${p.x},${p.y},${p.z}`;
    let room = this.deltas[key];
    const now = Date.now();
    if (!room) {
      const pristine = this.world.getRoom(p.map, p.x, p.y, p.z);
      if (!pristine) { this.roomState = null; return; }
      room = JSON.parse(JSON.stringify(pristine));
      this.deltas[key] = room;
    } else if (room.lastVisited && now - room.lastVisited > RESPAWN_DELAY_MS) {
      this.maybeRespawnEnemies(room);
    }
    room.lastVisited = now;
    this.roomState = new RoomState(room, this.player);
  }

  maybeRespawnEnemies(room) {
    const level = this.world.levels[this.player.map];
    if (!level) return;
    const rate = RESPAWN_RATES[level.kind] ?? 0;
    if (rate <= 0 || Math.random() >= rate) return;
    const pristine = this.world.getRoom(room.map, room.x, room.y, room.z);
    if (!pristine || !pristine.enemies.length) return;
    room.enemies = pristine.enemies.map(e => ({ name: e.name, hp: enemyMaxHp(e.name) }));
  }
  neighborCoords(dir) {
    const [dx, dy, dz] = DELTA[dir] || [0, 0, 0];
    return [this.player.x + dx, this.player.y + dy, this.player.z + dz];
  }
  unlockNeighbor(mapName, x, y, z, dir, reqName) {
    const key = `${mapName}|${x},${y},${z}`;
    let room = this.deltas[key];
    if (!room) {
      const pristine = this.world.getRoom(mapName, x, y, z);
      if (!pristine) return;
      room = JSON.parse(JSON.stringify(pristine));
      this.deltas[key] = room;
    }
    const di = room.doors[dir];
    if (di && di.pass.length && di.pass[0].name === reqName) di.pass.shift();
  }
  enemyBlock(emit) {
    if (!this.roomState) return true;
    const enemies = this.roomState.currentEnemies();
    if (!enemies.length) return true;
    const res = this.roomState.avoidEnemies(this.combat);
    if (!res.ok) { emit(`Enemies block your way! ${res.msg}`); return false; }
    emit(res.msg);
    return true;
  }
  moveThroughDoor(dir) {
    if (!this.roomState) return { ok: false, msg: "No room." };
    const rs = this.roomState;
    if (!["N", "E", "S", "W", "U", "D"].includes(dir))
      return { ok: false, msg: "Invalid direction." };
    if (!rs.isDoorVisible(dir))
      return { ok: false, msg: "There is no door in that direction." };
    if (!rs.canUseDoor(dir)) {
      const di = rs.room.doors[dir];
      if (!di) return { ok: false, msg: "No door there." };
      if (di.pass.length) return { ok: false, msg: `You need ${di.pass[0].name}.` };
      return { ok: false, msg: "Cannot go that way." };
    }
    const diPre = rs.room.doors[dir];
    let consumedReq = null;
    if (diPre.pass.length && diPre.pass[0].consume > 0)
      consumedReq = diPre.pass[0].name;
    if (!rs.useDoor(dir)) return { ok: false, msg: "Failed to use door." };
    const di = rs.room.doors[dir];
    const oldMap = this.player.map, oldX = this.player.x, oldY = this.player.y, oldZ = this.player.z;
    if (di && di.teleport) {
      const t = di.teleport;
      if (!this.world.mapNames().includes(t.map))
        return { ok: false, msg: `Unknown map '${t.map}'.` };
      const targetRoom = this.world.getRoom(t.map, t.x, t.y, t.z);
      if (!targetRoom) return { ok: false, msg: "Destination doesn't exist." };
      this.player.map = t.map;
      this.player.x = t.x; this.player.y = t.y; this.player.z = t.z;
      this.loadCurrentRoom();
      return { ok: true, msg: `Teleported to ${t.map} (${t.x},${t.y},${t.z}).` };
    }
    let dx = 0, dy = 0, dz = 0;
    if (dir === "N") dy = 1;
    else if (dir === "S") dy = -1;
    else if (dir === "E") dx = 1;
    else if (dir === "W") dx = -1;
    else if (dir === "U") dz = 1;
    else if (dir === "D") dz = -1;
    const nx = oldX + dx, ny = oldY + dy, nz = oldZ + dz;
    const dims = this.world.dimensions(this.player.map);
    if (!(nx >= 0 && nx < dims.x && ny >= 0 && ny < dims.y && nz >= 0 && nz < dims.z))
      return { ok: false, msg: "Out of world." };
    if (consumedReq)
      this.unlockNeighbor(oldMap, nx, ny, nz, OPPOSITE[dir], consumedReq);
    this.player.x = nx; this.player.y = ny; this.player.z = nz;
    this.loadCurrentRoom();
    return { ok: true, msg: `You move ${dir}.` };
  }
  openDoorWithItem(dir, itemName) {
    const rs = this.roomState;
    if (!rs) return { ok: false, msg: "No room." };
    const di = rs.room.doors[dir];
    if (!di) return { ok: false, msg: `No door ${dir}.` };
    if (!(di.pass.length && di.pass[0].name === itemName))
      return { ok: false, msg: `${dir} door doesn't need ${itemName}.` };
    const req = di.pass[0];
    const consumed = req.consume > 0;
    if (!rs.useDoor(dir)) return { ok: false, msg: "Cannot use that." };
    if (consumed) {
      const [nx, ny, nz] = this.neighborCoords(dir);
      this.unlockNeighbor(this.player.map, nx, ny, nz, OPPOSITE[dir], req.name);
    }
    return { ok: true, msg: `Used ${itemName} on ${dir} door.` };
  }
  useItem(item, dir = null) {
    const heartItem   = this.combat.heart_item;
    const shelterItem = this.combat.shelter_item;
    const fireItem    = this.combat.fire_item;
    const mealItem    = this.combat.meal_item;

    if (item === fireItem) {
      if (dir) return { ok: false, msg: "Fire doesn't take a direction." };
      if (!this.player.hasItem(fireItem)) return { ok: false, msg: `You have no ${fireItem}.` };
      if (!this.roomState) return { ok: false, msg: "No room." };
      const res = this.roomState.throwFire();
      if (res.ok) this.player.removeItem(fireItem, 1);
      return res;
    }
    if (item === shelterItem) {
      if (!this.player.hasItem(shelterItem)) return { ok: false, msg: `You have no ${shelterItem}.` };
      this.player.removeItem(shelterItem, 1);
      this.player.healFull();
      return { ok: true, msg: "You rest by the fire and recover your strength." };
    }
    if (item === mealItem) {
      if (!this.player.hasItem(mealItem)) return { ok: false, msg: `You have no ${mealItem}.` };
      this.player.removeItem(mealItem, 1);
      this.player.hp = Math.min(this.player.hp + 2, this.player.maxHp);
      return { ok: true, msg: "You eat the meal. (+2 HP)" };
    }
    if (item === heartItem) {
      if (!this.player.hasItem(heartItem)) return { ok: false, msg: `You have no ${heartItem}.` };
      this.player.removeItem(heartItem, 1);
      this.player.maxHp += 1;
      this.player.hp = Math.min(this.player.hp + 1, this.player.maxHp);
      return { ok: true, msg: `Your maximum HP rises to ${this.player.maxHp}.` };
    }
    if (!this.roomState) return { ok: false, msg: "No room." };
    const rs = this.roomState;
    if (item === "fight")     return rs.fightEnemies(this.combat);
    if (item === "avoidance") return rs.avoidEnemies(this.combat);
    if (dir) return this.openDoorWithItem(dir, item);
    const candidates = [];
    for (const [d, di] of Object.entries(rs.room.doors))
      if (di.pass.length && di.pass[0].name === item) candidates.push(d);
    if (!candidates.length) return { ok: false, msg: `No door requires ${item}.` };
    if (candidates.length > 1) return { ok: false, msg: `Multiple doors require ${item}; specify direction.` };
    return this.openDoorWithItem(candidates[0], item);
  }
  takeItem(name) {
    if (!this.roomState) return { ok: false, msg: "No room." };
    return this.roomState.takeItem(name);
  }
  findRecipe(inputs) {
    const sig = Object.entries(inputs).sort().map(([k, v]) => `${k}:${v}`).join("|");
    for (const r of RECIPES) {
      const rsig = Object.entries(r.inputs).sort().map(([k, v]) => `${k}:${v}`).join("|");
      if (rsig === sig) return r;
    }
    return null;
  }
  combine(inputs) {
    const pretty = Object.entries(inputs).sort()
      .map(([n, c]) => c > 1 ? `${n} x${c}` : n).join(" + ");
    const recipe = this.findRecipe(inputs);
    if (!recipe) return { ok: false, msg: `You don't know how to combine ${pretty}.` };
    for (const [name, count] of Object.entries(inputs))
      if (!this.player.hasItem(name, count))
        return { ok: false, msg: `You need ${count} ${name}.` };
    const out = recipe.output;
    if (this.player.isFullOf(out.item))
      return { ok: false, msg: `You can't carry any more ${out.item} (max ${MAX_ITEM_COUNT}). Use some before you craft more.` };
    for (const [name, count] of Object.entries(inputs))
      this.player.removeItem(name, count);
    const outCount = out.count || 1;
    this.player.grant(out.item, outCount);
    if (outCount > 1) return { ok: true, msg: `You combine ${pretty} into ${out.item} x${outCount}.` };
    return { ok: true, msg: `You combine ${pretty} into ${out.item}.` };
  }
  checkDeath(emit) {
    if (this.player.hp > 0) return;
    emit("You collapse.");
    if (this.combat.death.restore_hp) this.player.healFull();
    emit("You wake at the entrance.");
    if (this.player.map === "overworld") {
      this.player.x = 0; this.player.y = 0; this.player.z = 1;
    } else {
      this.player.x = 0; this.player.y = 0; this.player.z = 0;
    }
    this.loadCurrentRoom();
  }
  handleCommand(cmd) {
    const out = [];
    const emit = s => out.push(String(s ?? ""));
    let endedReason = null;
    cmd = cmd.trim();
    if (!cmd) return { lines: out, endedReason };
    const parts = cmd.toLowerCase().split(/\s+/);
    const action = parts[0];
    const heartItem   = this.combat.heart_item;
    const shelterItem = this.combat.shelter_item;
    const fireItem    = this.combat.fire_item;
    const mealItem    = this.combat.meal_item;
    const isFight = action === "fight" || (action === "use" && parts[1] === "fight");
    const isFlee  = action === "flee" || action === "avoid"
                 || (action === "use" && ["avoidance", "flee", "avoid"].includes(parts[1]));
    const isHeal  = action === "use" && [heartItem, shelterItem, mealItem].includes(parts[1]);
    const isFire  = action === "use" && parts[1] === fireItem;
    const isMeta  = isHeal || isFire;
    if (!isFight && !isFlee && !isMeta) {
      if (!this.enemyBlock(emit)) { this.checkDeath(emit); return { lines: out, endedReason }; }
    }
    if (action === "move") {
      if (parts.length < 2) { emit("Move where?"); this.checkDeath(emit); return { lines: out, endedReason }; }
      const r = this.moveThroughDoor(parts[1].toUpperCase());
      emit(r.msg);
    } else if (action === "use") {
      if (parts.length < 2) { emit("Use what?"); this.checkDeath(emit); return { lines: out, endedReason }; }
      const item = parts[1];
      const dir = parts.length >= 3 ? parts[2].toUpperCase() : null;
      const r = this.useItem(item, dir);
      emit(r.msg);
    } else if (action === "combine" || action === "craft" || action === "make") {
      if (parts.length < 2) { emit("Combine what? e.g. 'combine rock rock'"); this.checkDeath(emit); return { lines: out, endedReason }; }
      const inputs = {};
      for (const name of parts.slice(1)) inputs[name] = (inputs[name] || 0) + 1;
      const r = this.combine(inputs);
      emit(r.msg);
    } else if (action === "fight") {
      const r = this.useItem("fight"); emit(r.msg);
    } else if (action === "flee" || action === "avoid") {
      const r = this.useItem("avoidance"); emit(r.msg);
    } else if (action === "take") {
      if (parts.length < 2) { emit("Take what?"); this.checkDeath(emit); return { lines: out, endedReason }; }
      const name = parts[1];
      const r = this.takeItem(name);
      emit(r.msg);
      if (r.ok) {
        const victoryItem = this.goal?.victory_item;
        if (victoryItem && name === victoryItem) {
          emit("=".repeat(52));
          emit("VICTORY");
          emit("=".repeat(52));
          emit(this.goal.victory_message || "You have saved the world.");
          this.player.won = true;
          this.save();
          endedReason = "victory";
        }
      }
    } else {
      emit("Unknown command.");
    }
    if (!endedReason) this.checkDeath(emit);
    return { lines: out, endedReason };
  }
  save() {
    try {
      const data = {
        version: 2,
        world: this.world.config,
        player: this.player.toJSON(),
        deltas: this.deltas,
      };
      localStorage.setItem("pydventure.save", JSON.stringify(data));
    } catch (e) {
      console.warn("Save failed:", e);
    }
  }
}

function pickTerrain(description) {
  const low = (description || "").toLowerCase();
  const rules = [
    ["dead plain", "dead_plain"],
    ["lake bed",   "lakebed"],
    ["desert",     "desert"],
    ["stone hall", "stone_hall"],
    ["black stone","shrine"],
    ["forest",     "forest"],
    ["valley",     "valley"],
    ["plain",      "plains"],
    ["cave",       "cave"],
    ["crypt",      "crypt"],
    ["armory",     "armory"],
    ["library",    "library"],
    ["sanctum",    "sanctum"],
  ];
  for (const [kw, t] of rules) if (low.includes(kw)) return t;
  return "cave";
}

function groupEnemies(enemies) {
  const order = [];
  const groups = new Map();
  for (const e of enemies) {
    let g = groups.get(e.name);
    if (!g) {
      g = { name: e.name, count: 0, hp: 0, maxHp: 0 };
      groups.set(e.name, g);
      order.push(g);
    }
    g.count += 1;
    g.hp += Math.max(0, e.hp);
    g.maxHp += enemyMaxHp(e.name);
  }
  return order;
}

function stateFromSession(session) {
  const p = session.player;
  const rs = session.roomState;
  const goal = session.goal;
  let room = null;
  if (rs) {
    const doors = {};
    for (const dir of ["N", "E", "S", "W", "U", "D"]) {
      const di = rs.room.doors[dir];
      if (!di) { doors[dir] = { present: false }; continue; }
      doors[dir] = {
        present: true,
        locked: di.pass.length > 0,
        label: di.pass.length > 0 ? di.pass[0].name : null,
        teleport: di.teleport ? di.teleport.map : null,
      };
    }
    const enemies = rs.currentEnemies();
    const enemyPower = rs.enemyPower(enemies);
    const items = rs.currentItems().map(it => ({ name: it.name, count: it.count }));
    const hasFire = p.hasItem(session.combat.fire_item);
    room = {
      description: rs.room.description || "",
      terrain: pickTerrain(rs.room.description),
      doors,
      enemies: groupEnemies(enemies),
      enemyPower,
      items,
      canFight: enemies.length > 0,
      canFlee: enemies.length > 0,
      canFire: enemies.length > 0 && hasFire,
    };
  }
  const goalItem = goal?.item || "crystal";
  const goalCount = goal?.count || 0;
  const goalHave = p.inventory[goalItem] || 0;
  return {
    player: {
      map: p.map, x: p.x, y: p.y, z: p.z,
      swordLevel: p.swordLevel,
      hp: p.hp, maxHp: p.maxHp,
      skills: p.skills, inventory: p.inventory,
    },
    goal: {
      item: goalItem,
      count: goalCount, have: goalHave, won: p.won,
    },
    room,
  };
}

const TERRAIN_STYLES = {
  forest:     { sky: ["#7a9a78", "#2a4a2a"], ground: "#1e3a1e" },
  plains:     { sky: ["#9fb8cf", "#d8d0b8"], ground: "#b8a878" },
  desert:     { sky: ["#c8d4e0", "#e8d0a0"], ground: "#c8a870" },
  dead_plain: { sky: ["#a8a8a0", "#c8c0b0"], ground: "#6a6050" },
  lakebed:    { sky: ["#5a6a80", "#303a48"], ground: "#2a2820" },
  valley:     { sky: ["#8fb0d0", "#d8e0e8"], ground: "#706050" },
  cave:       { sky: ["#0a0c10", "#14161c"], ground: "#14161c" },
  stone_hall: { sky: ["#22242a", "#1a1c22"], ground: "#1a1c22" },
  crypt:      { sky: ["#1a2420", "#0e1a14"], ground: "#0e1a14" },
  armory:     { sky: ["#28201a", "#1a1410"], ground: "#1a1410" },

  sanctum:    { sky: ["#140c1c", "#0a0810"], ground: "#0a0810" },
  shrine:     { sky: ["#080810", "#080810"], ground: "#080810" },
};
let currentTerrain = null;

function renderTerrain(terrain) {
  if (terrain === currentTerrain) return;
  currentTerrain = terrain;
  const s = TERRAIN_STYLES[terrain] || TERRAIN_STYLES.cave;
  if (els.sky && els.sky.children[0] && els.sky.children[1]) {
    els.sky.children[0].setAttribute("stop-color", s.sky[0]);
    els.sky.children[1].setAttribute("stop-color", s.sky[1]);
  }
  els.terrain.querySelectorAll("path").forEach(p => p.setAttribute("fill", s.ground));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function isUsableItem(name) {
  if (!currentSession) return false;
  const c = currentSession.combat;
  return name === c.fire_item
      || name === c.shelter_item
      || name === c.heart_item
      || name === c.meal_item;
}

function renderStatus(state) {
  const p = state.player;
  const g = state.goal;
  const parts = [`<span>${p.map}:${p.x},${p.y},${p.z}</span>`];
  parts.push(`<span class="sep">|</span><span>sword ${p.swordLevel}</span>`);
  if (g.count) parts.push(`<span class="sep">|</span><span class="goal">${g.item} ${g.have}/${g.count}</span>`);
  const hpClass = p.hp <= Math.ceil(p.maxHp / 2) ? "hp low" : "hp";
  parts.push(`<span class="sep">|</span><span class="${hpClass}">hp ${p.hp}/${p.maxHp}</span>`);
  const skillStr = Object.entries(p.skills).map(([k, v]) => `${k[0]}${v}`).join("/");
  parts.push(`<span class="sep">|</span><span>skills ${skillStr}</span>`);

  const inv = p.inventory;
  const keys = Object.keys(inv);
  let invStr;
  if (!keys.length) {
    invStr = "(empty)";
  } else {
    invStr = keys.map(k => {
      const label = `${k}:${inv[k]}/${MAX_ITEM_COUNT}`;
      return isUsableItem(k)
        ? `<span class="inv-slot" data-use="${k}" title="Double-click or long-press to use">${label}</span>`
        : `<span class="inv-slot">${label}</span>`;
    }).join("  ");
  }
  parts.push(`<span class="sep">|</span><span class="inv">inv  ${invStr}</span>`);
  els.status.innerHTML = parts.join("");
}

function renderCenter(room) {
  if (!room) {
    els.descText.textContent = "Empty void. There is nothing here.";
    els.centerEnemies.innerHTML = "";
    els.centerItems.innerHTML = "";
    els.centerActions.innerHTML = "";
    return;
  }
  els.descText.textContent = room.description || "(no description)";

  if (room.enemies && room.enemies.length) {
    const chips = room.enemies.map(e => {
      const hpText = e.hp === e.maxHp ? `${e.hp} HP` : `${e.hp}/${e.maxHp} HP`;
      return `<span class="chip enemy">${e.name} ×${e.count} <small>${hpText}</small></span>`;
    });
    chips.push(`<span class="chip ep">EP ${room.enemyPower}</span>`);
    els.centerEnemies.innerHTML = chips.join("");
  } else {
    els.centerEnemies.innerHTML = "";
  }

  if (room.items && room.items.length) {
    els.centerItems.innerHTML = room.items.map(it =>
      `<span class="chip item">${it.name} ×${it.count}` +
      `<button type="button" data-cmd="take ${it.name}">Take</button></span>`
    ).join("");
  } else {
    els.centerItems.innerHTML = "";
  }

  const acts = [];
  if (room.canFight) acts.push(`<button type="button" data-cmd="fight">Fight</button>`);
  if (room.canFlee)  acts.push(`<button type="button" data-cmd="flee">Flee</button>`);
  if (room.canFire)  acts.push(`<button type="button" data-cmd="use fire">Fire</button>`);
  els.centerActions.innerHTML = acts.join("");
}

function renderDoors(doors) {
  for (const dir of ["N", "E", "S", "W", "U", "D"]) {
    const g = document.querySelector(`.btn[data-dir="${dir}"]`);
    if (!g) continue;
    const d = doors[dir];
    if (!d || !d.present) { g.dataset.present = "false"; continue; }
    g.dataset.present = "true";
    let kind = "door";
    if (d.locked) kind = "locked";
    else if (dir === "U" || dir === "D") kind = "updown";
    g.dataset.kind = kind;
    const sub = g.querySelector("text.sub");
    if (sub) {
      if (d.locked && d.label) sub.textContent = d.label;
      else if (d.teleport) sub.textContent = d.teleport;
      else sub.textContent = "";
    }
  }
}

function render(state) {
  renderStatus(state);
  renderCenter(state.room);
  renderDoors(state.room?.doors || {});
  renderTerrain(state.room?.terrain || "cave");
  if (currentSession) renderMapInto(els.minimapSvg, null, currentSession);
}

// --------------------------------------------------------------- feedback

const feedbackLines = [];
const MAX_FEEDBACK = 3;

function classify(line) {
  const low = line.toLowerCase();
  if (!line.trim()) return null;
  if (line.includes("VICTORY")) return "title";
  if (low.includes("victory") || low.includes("defeat the") || low.includes("you take")
      || low.includes("you combine") || low.includes("you rest") || low.includes("you collect")
      || low.includes("you hurl") || low.includes("you eat")) return "good";
  if (low.includes("driven back") || low.includes("fail") || low.includes("need ")
      || low.includes("collapse") || low.includes("cannot") || low.includes("unknown")
      || low.includes("don't") || low.includes("can't carry")) return "bad";
  return null;
}

function renderFeedback() {
  els.feedback.innerHTML = feedbackLines.slice().reverse().map(({ text, tag }) => {
    const cls = tag ? ` class="${tag}"` : "";
    return `<p${cls}>${escapeHtml(text)}</p>`;
  }).join("");
}

function appendFeedback(text, tag = null) {
  if (text === null || text === undefined || text === "") return;
  feedbackLines.push({ text: String(text), tag });
  if (feedbackLines.length > MAX_FEEDBACK) feedbackLines.shift();
  renderFeedback();
}

function clearFeedback() {
  feedbackLines.length = 0;
  renderFeedback();
}

function renderCombineInv() {
  if (!currentSession) return;
  const inv = currentSession.player.inventory;

    ).join("");
  }
  for (const slot of ["a", "b"]) {

    const item = combineSlots[slot];

      delete el.dataset.filled;

}

// --------------------------------------------------------------- map

// Geometry is static per (world, map, z) so we cache the rendered markup.
const mapGeomCache = new Map();

function renderMapInto(svgEl, statusEl, session) {
  const p = session.player;
  const dims = session.world.dimensions(p.map);
  if (!dims.x) {
    svgEl.innerHTML = "";
    if (statusEl) statusEl.innerHTML = "";
    return;
  }

  const cell = 60, gap = 8, pad = 20;
  const totalW = pad * 2 + dims.x * cell + (dims.x - 1) * gap;
  const totalH = pad * 2 + dims.y * cell + (dims.y - 1) * gap;
  svgEl.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);

  const cacheKey = `${session.world.seed}|${p.map}|${p.z}`;
  let geom = mapGeomCache.get(cacheKey);
  if (geom === undefined) {
    const parts = [];
    parts.push(`<g fill="#2f68a8" stroke="#2f68a8" stroke-width="1">`);
    for (let y = 0; y < dims.y; y++)
      for (let x = 0; x < dims.x; x++) {
        const cx = pad + x * (cell + gap);
        const cy = pad + (dims.y - 1 - y) * (cell + gap);
        parts.push(`<rect x="${cx}" y="${cy}" width="${cell}" height="${cell}"/>`);
      }
    parts.push(`</g>`);
    parts.push(`<g stroke="#2f68a8" stroke-width="61">`);
    for (let y = 0; y < dims.y; y++)
      for (let x = 0; x < dims.x; x++) {
        const room = session.world.getRoom(p.map, x, y, p.z);
        if (!room) continue;
        const doors = room.doors;
        const cx = pad + x * (cell + gap);
        const cy = pad + (dims.y - 1 - y) * (cell + gap);
        const cxE = cx + cell;
        const cyN = cy;
        const centerX = cx + cell / 2;
        const centerY = cy + cell / 2;
        if (doors.E) parts.push(`<line x1="${cxE}" y1="${centerY}" x2="${cxE + gap}" y2="${centerY}"/>`);
        if (doors.N) parts.push(`<line x1="${centerX}" y1="${cyN}" x2="${centerX}" y2="${cyN - gap}"/>`);
      }
    parts.push(`</g>`);
    geom = parts.join("");
    mapGeomCache.set(cacheKey, geom);
  }

  const px = pad + p.x * (cell + gap) + cell / 2;
  const py = pad + (dims.y - 1 - p.y) * (cell + gap) + cell / 2;
  // Marker radius scales with the viewBox so it stays legible in both the
  // full-size overlay map and the small docked mini map.
  const unit   = Math.max(totalW, totalH);
  const rDot   = unit * 0.011;
  const rPulse = unit * 0.020;

  svgEl.innerHTML = geom + `
    <g>
      <circle cx="${px}" cy="${py}" r="${rPulse}" fill="var(--accent)" opacity="0.25">
        <animate attributeName="r" values="${rPulse};${(rPulse * 1.55).toFixed(2)};${rPulse}" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="${px}" cy="${py}" r="${rDot}" fill="var(--accent)">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>`;

  if (statusEl) {
    statusEl.innerHTML = `<span>${p.map}, z = ${p.z}</span>` +
      `<span class="sep">|</span><span class="goal">you are at ${p.x},${p.y}</span>`;
  }
}

function renderMap(session) {
  renderMapInto(els.mapSvg, els.mapStatus, session);
  renderMapInto(els.minimapSvg, null, session);
}
